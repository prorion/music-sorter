[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-sorter"
version = "0.7.8"
description = "Windows MP3 library review and classification"
requires-python = ">=3.13"
dependencies = ["PySide6==6.11.2", "mutagen==1.48.1", "keyring==25.7.0", "openai==3.26.0", "anthropic==1.11.0", "pywin32==312; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0"]

[project.gui-scripts]
music-sorter = "music_sorter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_sorter = ["resources/*.json", "resources/*.svg", "resources/*.png", "resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
